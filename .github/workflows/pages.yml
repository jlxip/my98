name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the tested site to GitHub Pages (main only)
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Require main for publication
        if: inputs.deploy && github.ref != 'refs/heads/main'
        run: exit 1
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Fetch pinned submodules over HTTPS
        run: |
          git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24.17.0'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang make python3 wget
          rustup toolchain install 1.89.0 --profile minimal --target wasm32-unknown-unknown
          rustup default 1.89.0
          cargo install wasm-bindgen-cli --version 0.2.100 --locked --root build/crypto-tools
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Build and test the static artifact
        run: make site-test
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: build/site

  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.deploy)
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

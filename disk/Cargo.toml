[package]
name = "slop86-disk"
version = "0.1.0"
edition = "2021"
publish = false
[workspace]
[lib]
crate-type = ["cdylib", "rlib"]
[dependencies]
async-trait = "0.1"
wasm-bindgen-futures = "=0.4.50"
js-sys = "=0.3.77"
slop86-crypto = { path = "../crypto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
zeroize = { version = "1", features = ["derive"] }
wasm-bindgen = "=0.2.100"
[dev-dependencies]
futures = { version = "0.3", features = ["executor"] }
hex = "0.4"
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

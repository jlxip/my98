[package]
name = "my98-torrent"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0-only"

[workspace]

[dependencies]
feedtorrent-bep = { path = "../../build/feedtorrent/bep" }
feedtorrent-libtorrent = { path = "../../build/feedtorrent/backends/libtorrent" }
slop86-crypto = { path = "../crypto" }
anyhow = "1"
bendy = "=0.6.1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "=0.11.0"
sha2 = "0.10"
zeroize = "=1.9.1"

[profile.release]
opt-level = 3
lto = true

# Keep host proc-macro dylibs loadable on macOS 27 (rust-lang/rust#157750).
[profile.release.build-override]
strip = "none"
